<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08060a" />
  <title>Страница не найдена — BloodCube</title>
  <meta name="robots" content="noindex, follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10z' fill='%23c1081f'/%3E%3Cpath d='M16 3 28 10 16 17 4 10z' fill='%23ff3355'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/bloodcube-donate/css/style.css" />

  <style>
    .lost {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .lost__code {
      font-family: var(--font-head);
      font-size: clamp(96px, 22vw, 190px);
      line-height: 0.9;
      letter-spacing: 0.04em;
      background: linear-gradient(120deg, #ff5a6e, #c1081f 55%, #4d0410);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 20px 60px rgba(255, 45, 75, 0.35));
      margin-bottom: 8px;
    }
    .lost__title {
      font-family: var(--font-head);
      font-size: clamp(22px, 3.4vw, 30px);
      color: #fff;
      margin: 0 0 14px;
    }
    .lost__text {
      font-size: 15.5px;
      line-height: 1.65;
      color: #b9a7ae;
      max-width: 42ch;
      margin: 0 auto 30px;
    }
    .lost__row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .lost__row .btn { text-decoration: none; }
    .lost__links {
      margin-top: 34px;
      font-size: 13.5px;
      color: #6f6168;
    }
    .lost__links a { color: #b9a7ae; text-decoration: none; }
    .lost__links a:hover { color: #ff5a6e; }
  </style>
</head>
<body>

  <div class="bg-fx" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--blood"></div>
    <div class="bg-glow bg-glow--ice"></div>
  </div>

  <main class="lost">
    <div>
      <p class="lost__code" aria-hidden="true">404</p>
      <h1 class="lost__title">Эта страница ушла в другое измерение</h1>
      <p class="lost__text">
        Возможно, ссылка устарела или в адресе опечатка.
        Вернись в магазин — там всё на месте.
      </p>
      <div class="lost__row">
        <a href="/bloodcube-donate/" class="btn btn--blood">На главную</a>
        <a href="/bloodcube-donate/#donates" class="btn btn--ghost">К донатам</a>
      </div>
      <p class="lost__links">
        Нужна помощь? <a href="https://discord.gg/bloodcube" target="_blank" rel="noopener noreferrer">Discord</a>
        · <a href="https://t.me/bloodcube" target="_blank" rel="noopener noreferrer">Telegram</a>
      </p>
    </div>
  </main>

</body>
</html>
